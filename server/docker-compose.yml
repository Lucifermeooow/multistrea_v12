services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: multistream-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8889:8889"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  router:
    build: .
    container_name: multistream-router
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mediamtx
    ports:
      - "8787:8787"
    volumes:
      - router-data:/data

volumes:
  router-data:
